name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR push is disabled: ghcr.io/landjunge/tollgate exists but Actions
      # only has read_package (permission_denied on push). Build still proves
      # the Dockerfile. To publish again: delete or grant this repo Write on
      # https://github.com/users/landjunge/packages/container/package/tollgate
      # then restore login + push: true.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tollgate:ci
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
