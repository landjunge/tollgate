name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Docs drift
        run: bash scripts/check_docs_drift.sh
      - name: Migration ampel
        run: bash scripts/check_migration.sh
      - name: Pytest (unit + contract + distill)
        run: pytest -q
        env:
          TOLLGATE_HOME: ${{ runner.temp }}/tg-home
